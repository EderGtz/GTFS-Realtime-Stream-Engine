name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingestion-service

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Generate Protobuf types
      run: npm run generate-types

    - name: Run unit tests
      run: npm run test