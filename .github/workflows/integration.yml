name: CI GTFS Streaming

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    env:
      MONGO_PORT: 27017
      KAFKA_PORT: 9092
      KAFKA_BROKER: localhost:9092
      MONGO_URI: mongodb://localhost:27017/gtfs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Wait for Healthchecks (Kafka + Mongo)
        run: docker compose up -d --wait

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./ingestion-service
        run: npm install

      - name: Generate Protobuf types
        working-directory: ./ingestion-service
        run: npm run generate:types

      - name: Run Kafka Integration Test
        working-directory: ./ingestion-service
        run: npx vitest run tests/integration/

      - name: Turn off containers
        if: always()
        run: docker compose down -v