name: "CI: Kafka Integration"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    name: Docker Roundtrip
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      MONGO_PORT: 27017
      KAFKA_PORT: 9092
      KAFKA_BROKER: localhost:9092
      MONGO_URI: mongodb://localhost:27017/gtfs
      MONGO_DATABASE: gtfs_realtime
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: gtfs
      POSTGRES_DB: gtfs_realtime
      PG_DSN: postgresql://gtfs:gtfs@localhost:5432/gtfs_realtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Pre-pull Docker images (retry on registry flakiness)
        run: |
          set -u
          images=(
            mongo:7.0
            apache/kafka:3.9.0
            confluentinc/cp-kafka:7.6.0
          )
          for img in "${images[@]}"; do
            ok=""
            for attempt in 1 2 3 4 5; do
              if docker pull "$img"; then ok=1; break; fi
              echo "::warning::docker pull $img failed (attempt $attempt/5), retrying in 20s"
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "::error::docker pull $img failed after 5 attempts"
              exit 1
            fi
          done

      - name: Wait for Healthchecks (Kafka + Mongo)
        run: docker compose up -d --wait kafka mongodb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./ingestion-service
        run: npm install

      - name: Generate Protobuf types
        working-directory: ./ingestion-service
        run: npm run generate:types

      - name: Run Integration Tests (Kafka + API)
        working-directory: ./ingestion-service
        run: npx vitest run tests/integration/

      - name: Turn off containers
        if: always()
        run: docker compose down -v