name: "CI: Go Tests for archive consumer"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go-tests:
    name: Go Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./archive-consumer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: false

    - name: Check formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    # - name: Build
    #   run: go build ./...

    - name: Run unit tests
      run: go test ./... -count=1 -v

  go-integration-tests:
    name: Go Integration Tests (Kafka)
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: ./archive-consumer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: false

    - name: Pre-pull Kafka image (retry on registry flakiness)
      working-directory: .
      run: |
        set -u
        img=apache/kafka:3.9.0
        for attempt in 1 2 3 4 5; do
          if docker pull "$img"; then exit 0; fi
          echo "::warning::docker pull $img failed (attempt $attempt/5), retrying in 20s"
          sleep 20
        done
        echo "::error::docker pull $img failed after 5 attempts"
        exit 1

    - name: Run integration tests
      run: go test -tags=integration ./... -count=1 -v
