name: "CI: Go Tests for archive consumer"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go-tests:
    name: Go Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./archive-consumer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: false

    - name: Check formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    # - name: Build
    #   run: go build ./...

    - name: Run unit tests
      run: go test ./... -count=1 -v

  go-integration-tests:
    name: Go Integration Tests (Kafka)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./archive-consumer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: false

    - name: Run integration tests
      run: go test -tags=integration ./... -count=1 -v
