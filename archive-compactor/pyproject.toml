[project]
name = "archive-compactor"
version = "0.1.0"
description = "Daily Parquet compaction tier for the GTFS archive"
authors = [
    { name = "Eder Gutierrez", email = "gutierrezeder64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
