[project]
name = "analytics-engine"
version = "0.1.0"
description = "Analytics engine for public transportation telemetry"
readme = "README.md"
authors = [
    { name = "Eder Gutierrez", email = "gutierrezeder64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[project.scripts]
analytics-engine = "analytics_engine:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
